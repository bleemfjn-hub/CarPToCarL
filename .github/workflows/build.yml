name: build-apk

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'apk/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/CarPToCarL-ci.apk
          ls -l out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarPToCarL-ci
          path: out/CarPToCarL-ci.apk

      - name: Publish to release (fixed URL)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci
          name: CI build
          body: 自动构建，覆盖更新。提交 ${{ github.sha }}
          files: out/CarPToCarL-ci.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
